name: CPU smoke tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-data.txt
      - run: python -m pip install -r requirements-data.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s tools -p 'test_*.py' -v
      - run: bash -n train_solver.sh && bash -n train_rewriter.sh
      - run: python run_evolution.py --help && python evaluate.py --help
