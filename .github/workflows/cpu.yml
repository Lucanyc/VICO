name: Source checks
on: [push, pull_request]
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Python and shell syntax
        run: |
          python - <<'PY'
          import ast, pathlib, subprocess
          for path in pathlib.Path('.').rglob('*.py'):
              ast.parse(path.read_text(), filename=str(path))
          for path in pathlib.Path('.').rglob('*.sh'):
              subprocess.run(['bash', '-n', str(path)], check=True)
          PY
      - name: Original embedded reward cases
        run: |
          python - <<'PY'
          import ast, pathlib, re, unicodedata
          tree = ast.parse(pathlib.Path('reward.py').read_text())
          nodes = [n for n in tree.body if isinstance(n, (ast.FunctionDef, ast.If))]
          scope = {'__name__': '__main__', 're': re, 'unicodedata': unicodedata}
          exec(compile(ast.Module(body=nodes, type_ignores=[]), 'reward.py', 'exec'), scope)
          assert scope['all_pass']
          PY
